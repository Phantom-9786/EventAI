<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="620" viewBox="0 0 1216 620" role="img" aria-labelledby="title desc"><title id="title">How does the website know who I am?</title><desc id="desc">1. Sign in: Password or Google. 2. Create a session: Access token + refresh session. 3. Send a protected request: Bearer access token. 4. Check role and ownership: Server authorization. 5. Allow or reject the action: Authorized feature service</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#8797b3" stroke-width="1.5"/></marker></defs><rect width="1216" height="620" rx="22" fill="#f3f6fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="51" fill="#315adc" font-size="13" font-weight="700" letter-spacing="2">EVENTPOINT / LEARN THE FLOW</text><text x="42" y="104" fill="#14233e" font-size="34" font-weight="700">How does the website know who I am?</text><text x="42" y="143" fill="#53637b" font-size="18">Identity and permission are separate checks.</text><g><rect x="42" y="198" width="208.8" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="72" cy="230" r="17" fill="#315adc"/><text x="72" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">1</text><text x="62" y="276" fill="#14233e" font-size="20" font-weight="650">Sign in</text><text x="62" y="350" fill="#53637b" font-size="14" font-weight="400">Password or Google</text><path d="M 254.8 300 H 267.8" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="272.8" y="198" width="208.8" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="302.8" cy="230" r="17" fill="#315adc"/><text x="302.8" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">2</text><text x="292.8" y="276" fill="#14233e" font-size="20" font-weight="650">Create a session</text><text x="292.8" y="350" fill="#53637b" font-size="14" font-weight="400">Access token + refresh</text><text x="292.8" y="371" fill="#53637b" font-size="14" font-weight="400">session</text><path d="M 485.6 300 H 498.6" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="503.6" y="198" width="208.8" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="533.6" cy="230" r="17" fill="#315adc"/><text x="533.6" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">3</text><text x="523.6" y="276" fill="#14233e" font-size="20" font-weight="650">Send a protected</text><text x="523.6" y="306" fill="#14233e" font-size="20" font-weight="650">request</text><text x="523.6" y="350" fill="#53637b" font-size="14" font-weight="400">Bearer access token</text><path d="M 716.4000000000001 300 H 729.4000000000001" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="734.4000000000001" y="198" width="208.8" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="764.4000000000001" cy="230" r="17" fill="#315adc"/><text x="764.4000000000001" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">4</text><text x="754.4000000000001" y="276" fill="#14233e" font-size="20" font-weight="650">Check role and</text><text x="754.4000000000001" y="306" fill="#14233e" font-size="20" font-weight="650">ownership</text><text x="754.4000000000001" y="350" fill="#53637b" font-size="14" font-weight="400">Server authorization</text><path d="M 947.2 300 H 960.2" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="965.2" y="198" width="208.8" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="995.2" cy="230" r="17" fill="#137b6e"/><text x="995.2" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">5</text><text x="985.2" y="276" fill="#14233e" font-size="20" font-weight="650">Allow or reject the</text><text x="985.2" y="306" fill="#14233e" font-size="20" font-weight="650">action</text><text x="985.2" y="350" fill="#53637b" font-size="14" font-weight="400">Authorized feature service</text></g><rect x="42" y="445" width="1132" height="64" rx="13" fill="#e7eefc"/><text x="62" y="471" fill="#2448ae" font-size="12" font-weight="700" letter-spacing="1">REMEMBER</text><text x="62" y="495" fill="#273d65" font-size="15" font-weight="400">Authentication: who are you? Authorization: may you do this?</text><text x="42" y="556" fill="#53637b" font-size="15">JWT contents are signed, not encrypted. The system also uses database session state.</text><text x="42" y="592" fill="#64748b" font-size="12">Source-linked learning diagram • Each step is explained in the interactive atlas • 22 October 2026</text></g></svg>