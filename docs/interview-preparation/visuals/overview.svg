<svg xmlns="http://www.w3.org/2000/svg" width="1216" height="620" viewBox="0 0 1216 620" role="img" aria-labelledby="title desc"><title id="title">The whole project, in four parts</title><desc id="desc">1. A person takes an action: Attendee, organizer or admin. 2. The website sends a request: Next.js + React. 3. The API checks and decides: Express business services. 4. The database keeps the truth: PostgreSQL + Prisma</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="5" refY="3.5" orient="auto"><path d="M0,0 L6,3.5 L0,7" fill="none" stroke="#8797b3" stroke-width="1.5"/></marker></defs><rect width="1216" height="620" rx="22" fill="#f3f6fc"/><g font-family="Segoe UI,Arial,sans-serif"><text x="42" y="51" fill="#315adc" font-size="13" font-weight="700" letter-spacing="2">EVENTPOINT / LEARN THE FLOW</text><text x="42" y="104" fill="#14233e" font-size="34" font-weight="700">The whole project, in four parts</text><text x="42" y="143" fill="#53637b" font-size="18">The website asks. The server decides. The database remembers.</text><g><rect x="42" y="198" width="266.5" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="72" cy="230" r="17" fill="#315adc"/><text x="72" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">1</text><text x="62" y="276" fill="#14233e" font-size="20" font-weight="650">A person takes an action</text><text x="62" y="350" fill="#53637b" font-size="14" font-weight="400">Attendee, organizer or admin</text><path d="M 312.5 300 H 325.5" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="330.5" y="198" width="266.5" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="360.5" cy="230" r="17" fill="#315adc"/><text x="360.5" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">2</text><text x="350.5" y="276" fill="#14233e" font-size="20" font-weight="650">The website sends a</text><text x="350.5" y="306" fill="#14233e" font-size="20" font-weight="650">request</text><text x="350.5" y="350" fill="#53637b" font-size="14" font-weight="400">Next.js + React</text><path d="M 601 300 H 614" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="619" y="198" width="266.5" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="649" cy="230" r="17" fill="#315adc"/><text x="649" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">3</text><text x="639" y="276" fill="#14233e" font-size="20" font-weight="650">The API checks and decides</text><text x="639" y="350" fill="#53637b" font-size="14" font-weight="400">Express business services</text><path d="M 889.5 300 H 902.5" stroke="#8797b3" stroke-width="2" marker-end="url(#arrow)"/></g><g><rect x="907.5" y="198" width="266.5" height="208" rx="18" fill="white" stroke="#dce3ee"/><circle cx="937.5" cy="230" r="17" fill="#137b6e"/><text x="937.5" y="236" text-anchor="middle" fill="white" font-size="15" font-weight="700">4</text><text x="927.5" y="276" fill="#14233e" font-size="20" font-weight="650">The database keeps the</text><text x="927.5" y="306" fill="#14233e" font-size="20" font-weight="650">truth</text><text x="927.5" y="350" fill="#53637b" font-size="14" font-weight="400">PostgreSQL + Prisma</text></g><rect x="42" y="445" width="1132" height="64" rx="13" fill="#e7eefc"/><text x="62" y="471" fill="#2448ae" font-size="12" font-weight="700" letter-spacing="1">REMEMBER</text><text x="62" y="495" fill="#273d65" font-size="15" font-weight="400">Redis helps with speed and AI limits; it is not the inventory authority.</text><text x="42" y="556" fill="#53637b" font-size="15">Cloudinary stores images; Brevo sends email; Razorpay handles payments; Groq generates AI text.</text><text x="42" y="592" fill="#64748b" font-size="12">Source-linked learning diagram • Each step is explained in the interactive atlas • 22 October 2026</text></g></svg>